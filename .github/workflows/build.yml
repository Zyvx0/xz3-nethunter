name: Build Jawirprek Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 device-tree-compiler wget gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Clone aoitsme 4.9 Kernel Source & ZyCromerZ Clang 21
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 https://github.com/aoitsme/android_kernel_qcom_sdm845.git kernel
          mkdir -p clang
          python3 - << 'EOF'
          import json, os, urllib.request

          tar_url = None
          for prefix in ("Clang-21.", "Clang-20."):
              for page in range(1, 8):
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/ZyCromerZ/Clang/releases?per_page=100&page={page}",
                      headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "User-Agent": "Mozilla/5.0"}
                  )
                  releases = json.loads(urllib.request.urlopen(req).read().decode())
                  if not releases:
                      break
                  for rel in releases:
                      for asset in rel.get("assets", []):
                          name = asset["name"]
                          if name.startswith(prefix) and name.endswith(".tar.gz"):
                              tar_url = asset["browser_download_url"]
                              break
                      if tar_url:
                          break
                  if tar_url:
                      break
              if tar_url:
                  break

          assert tar_url, "Arsip ZyCromerZ Clang 21/20 tidak ditemukan"
          print("Downloading Toolchain:", tar_url)
          urllib.request.urlretrieve(tar_url, "clang/clang.tar.gz")
          EOF
          tar -xf clang/clang.tar.gz -C clang && rm -f clang/clang.tar.gz
          ./clang/bin/clang --version
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Integrate Official Tian KernelSU (v0.9.5 Non-GKI 4.9)
        working-directory: kernel
        run: |
          export GIT_TERMINAL_PROMPT=0
          rm -rf KernelSU drivers/kernelsu
          git clone --depth=1 -b v0.9.5 https://github.com/tiann/KernelSU.git KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'drivers/kernelsu/' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          for f in drivers/kernelsu/Makefile drivers/kernelsu/Kbuild; do
            if [ -f "$f" ]; then
              printf '\nccflags-y += -O3 -std=gnu11 -Wno-everything -I$(objtree)/security/selinux -I$(srctree)/security/selinux/include\n' >> "$f"
            fi
          done

          mkdir -p include/linux/sched
          for h in signal.h task.h mm.h user.h coredump.h jobctl.h debug.h; do
            [ -f "include/linux/sched/$h" ] || echo '#include <linux/sched.h>' > "include/linux/sched/$h"
          done
          [ -f "include/linux/pgtable.h" ] || echo '#include <asm/pgtable.h>' > "include/linux/pgtable.h"
          [ -f "include/linux/compiler_types.h" ] || echo '#include <linux/compiler.h>' > "include/linux/compiler_types.h"

          cd ..
          wget -q https://github.com/tiann/KernelSU/releases/download/v0.9.5/KernelSU_v0.9.5_11872-release.apk || \
          curl -sL https://api.github.com/repos/tiann/KernelSU/releases/tags/v0.9.5 | grep -oE 'https://[^"]+\.apk' | head -n 1 | xargs wget -q

      - name: Apply NetHunter HID & Wi-Fi Injection Patches
        working-directory: kernel
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nh-patches
          for p in $(find nh-patches/patches -type f \( -path "*4.09*" -o -path "*4.9*" \) \( -name "*wifi-injection*" -o -name "*hid-gadget*" \)); do
            echo "Applying $p"
            patch -p1 < "$p" || true
          done
          rm -rf nh-patches

      - name: Patch -O3, Auto-Active Gaming Cooling & Memory Cache
        working-directory: kernel
        run: |
          sed -i 's/-O2/-O3/g' Makefile

          python3 - << 'EOF'
          import os, re

          # 1. Auto-clamp CPU Gold Cluster max freq di 2.47 GHz (pangkas 2 bin voltase terpanas SDM845)
          cpufreq_c = "drivers/cpufreq/cpufreq.c"
          if os.path.isfile(cpufreq_c):
              txt = open(cpufreq_c, errors="ignore").read()
              if "policy->max = new_policy->max;" in txt and "2476800" not in txt:
                  txt = txt.replace(
                      "policy->max = new_policy->max;",
                      "policy->max = new_policy->max;\n\tif (policy->cpu >= 4 && policy->max > 2476800)\n\t\tpolicy->max = 2476800;",
                      1
                  )
                  open(cpufreq_c, "w").write(txt)
                  print("Patched native CPU Gold sweet-spot (2.47 GHz) in cpufreq.c")

          # 2. Auto-cap GPU Adreno 630 max power level ke level 1 (596 MHz, hindari bin panas 710 MHz)
          kgsl_c = "drivers/gpu/msm/kgsl_pwrctrl.c"
          if os.path.isfile(kgsl_c):
              txt = open(kgsl_c, errors="ignore").read()
              m = re.search(r'(void\s+kgsl_pwrctrl_pwrlevel_change\s*\([^)]+\)\s*\{)', txt)
              if m and "Jawirprek GPU cap" not in txt:
                  inject = m.group(1) + "\n\t/* Jawirprek GPU cap: 596 MHz */\n\tif (device->pwrctrl.num_pwrlevels > 2 && new_level == 0)\n\t\tnew_level = 1;"
                  txt = txt[:m.start(1)] + inject + txt[m.end(1):]
                  open(kgsl_c, "w").write(txt)
                  print("Patched native Adreno 630 sweet-spot (596 MHz) in kgsl_pwrctrl.c")

          # 3. Tuning schedutil default rate limits (500 us naik / 2000 us turun)
          sugov_c = "kernel/sched/cpufreq_schedutil.c"
          if os.path.isfile(sugov_c):
              txt = open(sugov_c, errors="ignore").read()
              if "tunables->down_rate_limit_us" in txt and "Jawirprek schedutil" not in txt:
                  txt = re.sub(
                      r'(tunables->down_rate_limit_us\s*=\s*[^;]+;)',
                      r'\1\n\t/* Jawirprek schedutil */\n\ttunables->up_rate_limit_us = 500;\n\ttunables->down_rate_limit_us = 2000;',
                      txt,
                      count=1
                  )
                  open(sugov_c, "w").write(txt)
                  print("Patched native schedutil rate limits in cpufreq_schedutil.c")

          # 4. Turunkan default vfs_cache_pressure ke 50 agar cache game bertahan lama di RAM 4GB
          dcache_c = "fs/dcache.c"
          if os.path.isfile(dcache_c):
              txt = open(dcache_c, errors="ignore").read()
              patched = re.sub(
                  r'(int\s+sysctl_vfs_cache_pressure\b[^=]*=\s*)100(\s*;)',
                  r'\g<1>50\2',
                  txt,
                  count=1
              )
              if patched != txt:
                  open(dcache_c, "w").write(patched)
                  print("Patched default vfs_cache_pressure -> 50 in fs/dcache.c")
          EOF

      - name: Merge Defconfig (Auto-Detect aoitsme Sony Tama/Akatsuki + Native NFC)
        working-directory: kernel
        run: |
          python3 - << 'EOF'
          import glob, os, re

          all_files = sorted(
              os.path.relpath(p, "arch/arm64/configs")
              for p in glob.glob("arch/arm64/configs/**/*", recursive=True)
              if os.path.isfile(p)
          )
          print("Available configs in aoitsme kernel:", all_files)

          def pick_defconfig(files):
              for pat in (
                  r'(?:^|/)[^/]*akatsuki[^/]*defconfig$',
                  r'(?:^|/)lineage[^/]*tama[^/]*defconfig$',
                  r'(?:^|/)[^/]*tama[^/]*defconfig$',
                  r'(?:^|/)sdm845-perf_defconfig$',
                  r'(?:^|/)sdm845_defconfig$',
              ):
                  matches = [f for f in files if re.search(pat, f)]
                  if matches:
                      matches.sort(key=len)
                      return matches[0]
              return None

          defcfg = pick_defconfig(all_files)
          assert defcfg, f"Defconfig Sony SDM845 tidak ditemukan di: {all_files}"
          print("Selected base defconfig:", defcfg)

          cfg_path = os.path.join("arch/arm64/configs", defcfg)
          base_txt = open(cfg_path, errors="ignore").read()

          # Gabungkan fragment konfigurasi tama / akatsuki jika tersedia secara terpisah
          extra_frags = [
              f for f in all_files
              if f != defcfg and f.endswith(".config") and re.search(r'(?:tama|akatsuki)', f)
          ]
          with open(cfg_path, "a") as out_f:
              for frag in extra_frags:
                  print("Appending device config fragment:", frag)
                  out_f.write("\n" + open(os.path.join("arch/arm64/configs", frag), errors="ignore").read() + "\n")

              # Aktifkan simbol board akatsuki jika ada di Kconfig terpadu tama
              kconfigs = glob.glob("arch/arm64/**/Kconfig*", recursive=True) + glob.glob("drivers/**/Kconfig*", recursive=True)
              has_akatsuki_sym = any(
                  "MACH_SONY_AKATSUKI" in open(kc, errors="ignore").read()
                  for kc in kconfigs
              )
              if has_akatsuki_sym:
                  print("Enabling CONFIG_MACH_SONY_AKATSUKI=y")
                  out_f.write("\nCONFIG_MACH_SONY_AKATSUKI=y\n")

          with open(os.environ["GITHUB_ENV"], "a") as env_f:
              env_f.write(f"DEFCONFIG_NAME={defcfg}\n")
              env_f.write(f"CFG_PATH={cfg_path}\n")
          EOF

          cat ../nethunter.fragment >> "$CFG_PATH"
          for sym in LOCALVERSION KALLSYMS SCHED_DEBUG DEBUG_PREEMPT LTO THINLTO HZ DEFAULT_CFQ CPU_BOOST CPU_FREQ_GOV CRYPTO_LZ4 ZRAM CRYPTO_CRC32_ARM64 ARM64_CRYPTO; do
            sed -i "/CONFIG_${sym}/d" "$CFG_PATH"
          done

          printf '%s\n' \
            'CONFIG_LOCALVERSION="-Jawirprek"' \
            '# CONFIG_LOCALVERSION_AUTO is not set' \
            'CONFIG_KALLSYMS=y' \
            'CONFIG_KALLSYMS_ALL=y' \
            'CONFIG_KPROBES=y' \
            'CONFIG_KRETPROBES=y' \
            'CONFIG_KPROBE_EVENTS=y' \
            'CONFIG_OVERLAY_FS=y' \
            'CONFIG_KSU=y' \
            'CONFIG_HZ_300=y' \
            'CONFIG_HZ=300' \
            'CONFIG_CPU_BOOST=y' \
            'CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y' \
            'CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y' \
            'CONFIG_CPU_FREQ_GOV_POWERSAVE=y' \
            'CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y' \
            'CONFIG_IOSCHED_DEADLINE=y' \
            'CONFIG_DEFAULT_DEADLINE=y' \
            'CONFIG_TCP_CONG_ADVANCED=y' \
            'CONFIG_TCP_CONG_BBR=y' \
            'CONFIG_DEFAULT_BBR=y' \
            'CONFIG_NET_SCH_FQ=y' \
            'CONFIG_NET_SCH_FQ_CODEL=y' \
            'CONFIG_CRYPTO_LZ4=y' \
            'CONFIG_CRYPTO_ZSTD=y' \
            'CONFIG_ZSTD_COMPRESS=y' \
            'CONFIG_ZSTD_DECOMPRESS=y' \
            'CONFIG_ZRAM=y' \
            'CONFIG_ARM64_CRYPTO=y' \
            'CONFIG_CRYPTO_SHA256_ARM64=y' \
            'CONFIG_CRYPTO_AES_ARM64_CE_BLK=y' \
            'CONFIG_CRYPTO_CRC32_ARM64=y' \
            '# CONFIG_SCHED_DEBUG is not set' \
            '# CONFIG_DEBUG_PREEMPT is not set' \
            '# CONFIG_DEFAULT_CFQ is not set' \
            >> "$CFG_PATH"

          sed -i '/CONFIG_ATH9K_HTC/d' "$CFG_PATH"
          echo "# CONFIG_ATH9K_HTC is not set" >> "$CFG_PATH"
          find . \( -name "Makefile*" -o -name "Kbuild*" \) -type f -exec sed -i \
            -e 's/-Werror-implicit-function-declaration/-Wno-error=implicit-function-declaration/g' \
            -e 's/-Werror=/-Wno-error=/g' \
            -e 's/-Werror\([[:space:]"'\'']\|$\)/\1/g' {} +

      - name: Compile Kernel (Clang 21 -O3 + LLD + Kryo 385 Tuning)
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="jawirprek"
          export KBUILD_BUILD_HOST="akatsuki"
          export PATH="$PWD/../clang/bin:$PATH"

          MAKE_ARGS=(
            -j$(nproc --all)
            O=out
            ARCH=arm64
            LOCALVERSION="-Jawirprek"
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          OPT_CFLAGS="-O3 -Wno-everything -mtune=cortex-a75"

          make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          grep -q "CONFIG_KSU=y" out/.config || (echo "ERROR: CONFIG_KSU=y belum aktif!" && exit 1)
          echo "=== KONFIGURASI NFC & BOARD AKATSUKI ==="
          grep -E "CONFIG_NFC|CXD224|FELICA|MACH_SONY" out/.config || true

          make "${MAKE_ARGS[@]}" prepare
          make "${MAKE_ARGS[@]}" KCFLAGS="$OPT_CFLAGS" init/ security/selinux/

          if ! make "${MAKE_ARGS[@]}" KCFLAGS="$OPT_CFLAGS" drivers/kernelsu/ 2>&1 | tee ksu.log; then
            echo "=== ERROR DRIVER KSU ==="
            grep -iE "error:" ksu.log | tail -n 25
            exit 1
          fi

          if ! make "${MAKE_ARGS[@]}" KCFLAGS="$OPT_CFLAGS" Image.gz-dtb 2>&1 | tee build.log; then
            echo "=== RINGKASAN ERROR COMPILE ==="
            grep -iE "error:" build.log | tail -n 25
            exit 1
          fi

      - name: Package AnyKernel3 Zip
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          sed -i 's#^do.devicecheck=.*#do.devicecheck=0#Ig' anykernel/anykernel.sh
          sed -i 's#^block=.*#block=auto;#Ig' anykernel/anykernel.sh
          sed -i 's#^is_slot_device=.*#is_slot_device=auto;#Ig' anykernel/anykernel.sh
          sed -i 's#^kernel.string=.*#kernel.string=Jawirprek Kernel | Xperia XZ3 (akatsuki) | KSU + NetHunter#Ig' anykernel/anykernel.sh
          cd anykernel
          zip -r9 ../Jawirprek-Kernel-akatsuki-$(date +%Y%m%d).zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jawirprek-Kernel-akatsuki
          path: |
            Jawirprek-Kernel-akatsuki-*.zip
            KernelSU_v0.9.5*.apk
