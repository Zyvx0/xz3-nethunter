name: Build Jawirprek KSU Nethunter XZ3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Config Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 device-tree-compiler wget

      - name: Clone Kernel Source (4.9.337) & Toolchain
        run: |
          git clone --depth=1 -b lineage-20 https://github.com/LineageOS/android_kernel_sony_sdm845.git kernel
          mkdir -p clang && cd clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.0-20230129-release/Clang-16.0.0-20230129.tar.gz
          tar -xf Clang-16.0.0-20230129.tar.gz && rm -f Clang-16.0.0-20230129.tar.gz
          cd ..
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

      - name: Fetch KowSU APK & Extract Exact Certificate Hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json, os, struct, hashlib, urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/KOWX712/KernelSU/releases?per_page=5",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "User-Agent": "Mozilla/5.0"}
          )
          releases = json.loads(urllib.request.urlopen(req).read().decode())
          apk_url = None
          for rel in releases:
              for asset in rel.get("assets", []):
                  if asset["name"].endswith(".apk"):
                      apk_url = asset["browser_download_url"]
                      break
              if apk_url:
                  break

          assert apk_url, "APK KowSU tidak ditemukan di GitHub Releases"
          print("Downloading:", apk_url)
          urllib.request.urlretrieve(apk_url, "KowSU-Manager.apk")

          data = open("KowSU-Manager.apk", "rb").read()
          idx = data.rfind(b"APK Sig Block 42")
          assert idx != -1, "APK Sig Block 42 tidak ditemukan"
          block_size = struct.unpack("<Q", data[idx-8:idx])[0]
          block = data[idx+16-block_size : idx-8]

          pos = 0
          cert = None
          while pos < len(block):
              pair_len, pair_id = struct.unpack("<QI", block[pos:pos+12])
              val = block[pos+12 : pos+8+pair_len]
              if pair_id == 0x7109871a:
                  signed_data_len = struct.unpack("<I", val[8:12])[0]
                  signed_data = val[12 : 12+signed_data_len]
                  digests_len = struct.unpack("<I", signed_data[0:4])[0]
                  certs_off = 4 + digests_len
                  first_cert_len = struct.unpack("<I", signed_data[certs_off+4:certs_off+8])[0]
                  cert = signed_data[certs_off+8 : certs_off+8+first_cert_len]
                  break
              pos += 8 + pair_len

          assert cert is not None, "Sertifikat v2 tidak ditemukan"
          cert_size = f"0x{len(cert):04x}"
          cert_hash = hashlib.sha256(cert).hexdigest()
          print(f"KOWSU_SIZE={cert_size}")
          print(f"KOWSU_HASH={cert_hash}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"KOWSU_SIZE={cert_size}\n")
              f.write(f"KOWSU_HASH={cert_hash}\n")
          EOF

      - name: Integrate KernelSU (rsuntk Non-GKI 4.9 + KowSU Signature)
        working-directory: kernel
        run: |
          export GIT_TERMINAL_PROMPT=0
          rm -rf KernelSU drivers/kernelsu
          git clone https://github.com/rsuntk/KernelSU.git KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'drivers/kernelsu/' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

          for f in drivers/kernelsu/Makefile drivers/kernelsu/Kbuild; do
            if [ -f "$f" ]; then
              sed -i --follow-symlinks -E "s/(KSU_)?EXPECTED_SIZE[[:space:]]*[:?]=.*/\1EXPECTED_SIZE := ${KOWSU_SIZE}/g" "$f"
              sed -i --follow-symlinks -E "s/(KSU_)?EXPECTED_HASH[[:space:]]*[:?]=.*/\1EXPECTED_HASH := ${KOWSU_HASH}/g" "$f"
              printf '\nccflags-y += -std=gnu11 -Wno-error -I$(objtree)/security/selinux -I$(srctree)/security/selinux/include\n' >> "$f"
            fi
          done
          echo "=== VERIFIKASI SIGNATURE KOWSU DI KBUILD ==="
          grep -rnE "EXPECTED_(SIZE|HASH)" drivers/kernelsu/

          mkdir -p include/linux/sched
          for h in signal.h task.h mm.h user.h coredump.h jobctl.h debug.h; do
            [ -f "include/linux/sched/$h" ] || echo '#include <linux/sched.h>' > "include/linux/sched/$h"
          done
          [ -f "include/linux/pgtable.h" ] || echo '#include <asm/pgtable.h>' > "include/linux/pgtable.h"
          [ -f "include/linux/compiler_types.h" ] || echo '#include <linux/compiler.h>' > "include/linux/compiler_types.h"

          if ! grep -q "int path_umount" fs/namespace.c; then
            printf '%s\n' \
              '' \
              'static int can_umount(const struct path *path, int flags)' \
              '{' \
              '    struct mount *mnt = real_mount(path->mnt);' \
              '    if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))' \
              '        return -EINVAL;' \
              '    if (!may_mount())' \
              '        return -EPERM;' \
              '    if (path->dentry != path->mnt->mnt_root)' \
              '        return -EINVAL;' \
              '    if (!check_mnt(mnt))' \
              '        return -EINVAL;' \
              '    if (mnt->mnt.mnt_flags & MNT_LOCKED)' \
              '        return -EINVAL;' \
              '    if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))' \
              '        return -EPERM;' \
              '    return 0;' \
              '}' \
              '' \
              'int path_umount(struct path *path, int flags)' \
              '{' \
              '    struct mount *mnt = real_mount(path->mnt);' \
              '    int ret = can_umount(path, flags);' \
              '    if (!ret)' \
              '        ret = do_umount(mnt, flags);' \
              '    dput(path->dentry);' \
              '    mntput_no_expire(mnt);' \
              '    return ret;' \
              '}' \
              >> fs/namespace.c
          fi

      - name: Apply NetHunter HID & Wi-Fi Injection Patches
        working-directory: kernel
        run: |
          git clone --depth=1 https://gitlab.com/kalilinux/nethunter/build-scripts/kali-nethunter-kernel.git nh-patches
          for p in $(find nh-patches/patches -type f \( -path "*4.09*" -o -path "*4.9*" \) \( -name "*wifi-injection*" -o -name "*hid-gadget*" \)); do
            echo "Applying $p"
            patch -p1 < "$p" || true
          done
          rm -rf nh-patches

      - name: Merge Defconfig, NFC KDDI (CXD224x) & Kernel Identity
        working-directory: kernel
        run: |
          cat ../nethunter.fragment >> arch/arm64/configs/tama_akatsuki_defconfig
          sed -i '/CONFIG_LOCALVERSION/d' arch/arm64/configs/tama_akatsuki_defconfig
          sed -i '/CONFIG_KALLSYMS/d' arch/arm64/configs/tama_akatsuki_defconfig
          printf '%s\n' \
            'CONFIG_LOCALVERSION="-Jawirprek-SOV39@Jawirprek"' \
            '# CONFIG_LOCALVERSION_AUTO is not set' \
            'CONFIG_KALLSYMS=y' \
            'CONFIG_KALLSYMS_ALL=y' \
            'CONFIG_KPROBES=y' \
            'CONFIG_KRETPROBES=y' \
            'CONFIG_KPROBE_EVENTS=y' \
            'CONFIG_OVERLAY_FS=y' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_KPROBES_HOOK=y' \
            'CONFIG_NFC=y' \
            'CONFIG_NFC_NCI=y' \
            'CONFIG_NFC_NQ=y' \
            >> arch/arm64/configs/tama_akatsuki_defconfig

          for cfg in $(grep -rnE '^[[:space:]]*config[[:space:]]+(NFC_CXD224X|SONY_FELICA|NFC_SONY|SNFC)' drivers/ | sed -E 's/.*config[[:space:]]+([A-Z0-9_]+).*/CONFIG_\1=y/' | sort -u); do
            echo "Enabling NFC SOV39 config: $cfg"
            echo "$cfg" >> arch/arm64/configs/tama_akatsuki_defconfig
          done

          echo "=== CEK KONFIGURASI NFC DI DEVICE TREE TAMA ==="
          grep -rnE "cxd224x|nq@28" arch/arm64/boot/dts/qcom/ || true

          sed -i '/CONFIG_ATH9K_HTC/d' arch/arm64/configs/tama_akatsuki_defconfig
          echo "# CONFIG_ATH9K_HTC is not set" >> arch/arm64/configs/tama_akatsuki_defconfig
          find . \( -name "Makefile*" -o -name "Kbuild*" \) -type f -exec sed -i \
            -e 's/-Werror-implicit-function-declaration/-Wno-error=implicit-function-declaration/g' \
            -e 's/-Werror=/-Wno-error=/g' \
            -e 's/-Werror\([[:space:]"'\'']\|$\)/\1/g' {} +

      - name: Compile Kernel
        working-directory: kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Opreker-Gapunya-Alat"
          export KBUILD_BUILD_HOST="Inc.KSU+NetHunter"
          export PATH="$PWD/../clang/bin:$PATH"
          make O=out ARCH=arm64 tama_akatsuki_defconfig
          grep -E "CONFIG_KSU|CONFIG_NFC" out/.config
          grep -q "CONFIG_KSU=y" out/.config || (echo "ERROR: CONFIG_KSU=y belum aktif!" && exit 1)

          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- prepare
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-error=strict-prototypes -Wno-error=implicit-function-declaration" init/ security/selinux/
          if ! make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-error=strict-prototypes -Wno-error=implicit-function-declaration" drivers/kernelsu/ 2>&1 | tee ksu.log; then
            echo "=== ERROR DRIVER KSU ==="
            grep -iE "error:" ksu.log | tail -n 25
            exit 1
          fi

          if ! make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error -Wno-error=strict-prototypes -Wno-error=implicit-function-declaration" Image.gz-dtb 2>&1 | tee build.log; then
            echo "=== RINGKASAN ERROR COMPILE ==="
            grep -iE "error:" build.log | tail -n 25
            exit 1
          fi

      - name: Package AnyKernel3 Zip
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          sed -i 's#^do.devicecheck=.*#do.devicecheck=0#Ig' anykernel/anykernel.sh
          sed -i 's#^block=.*#block=auto;#Ig' anykernel/anykernel.sh
          sed -i 's#^is_slot_device=.*#is_slot_device=auto;#Ig' anykernel/anykernel.sh
          sed -i 's#^kernel.string=.*#kernel.string=Jawirprek Kernel (Opreker Gapunya Alat | Inc. KSU + NetHunter) - TG: @Jawirprek#Ig' anykernel/anykernel.sh
          cd anykernel
          zip -r9 ../Jawirprek-SOV39-KSU+NetHunter-$(date +%Y%m%d).zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jawirprek-SOV39-KSU+NetHunter
          path: |
            Jawirprek-SOV39-KSU+NetHunter-*.zip
            KowSU-Manager.apk
